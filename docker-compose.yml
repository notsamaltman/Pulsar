services:
  ml-service:
    build: ml-service/.
    container_name: ml-service
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service:/store
    networks:
      - pulsar-network
    environment:
      - REDIS_URL=redis://cache:6379

  cache:
    image: redis:alpine
    ports:
      - "6379:6379"
  web-app:
    build: web-app/.
    container_name: web-app
    ports:
      - "3000:3000"
    volumes:
      - ./web-app:/app
    networks:
      - pulsar-network
      
networks:
  pulsar-network:
    driver: bridge